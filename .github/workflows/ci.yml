# Phase 0 CI. No secrets, no cloud accounts: every job runs locally on the GitHub runner.
# Private repos on GitHub Free get a monthly Actions allowance; once used up, runs stop (no card = no bill).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin (lint, scoring fixtures, Android tests, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android platform 37 and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default cache provider is a "free preview" for private repos; the basic one is plain actions/cache.
          cache-provider: basic
      - run: ./gradlew ktlintCheck :core:test :android:testDebugUnitTest :android:assembleDebug --console=plain
      - name: Upload debug APK (for sideloading onto the test phone)
        uses: actions/upload-artifact@v7
        with:
          name: brainrot-phase0-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload rendered heatmap evidence
        uses: actions/upload-artifact@v7
        with:
          name: heatmap-evidence
          path: docs/phase0/evidence/*.png
          retention-days: 14

  web-scoring:
    name: TypeScript scoring (same fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
        working-directory: web/scoring

  firestore-rules:
    name: Firestore rules + offline behaviour (local emulator only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-spikes/firebase/package-lock.json
      - run: npm ci
        working-directory: backend-spikes/firebase
      - run: npm test
        working-directory: backend-spikes/firebase

  supabase-rls:
    name: Supabase schema + RLS (local PostgreSQL only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run RLS tests against the runner's preinstalled PostgreSQL
        run: |
          export PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          ./backend-spikes/supabase/run-local-tests.sh

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks over the full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
